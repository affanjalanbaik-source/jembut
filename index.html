function toast(msg,type=''){const region=document.getElementById('toastRegion');if(!region)return;const t=document.createElement('div');t.className='toast '+type;t.textContent=msg;region.append(t);setTimeout(()=>t.remove(),3000)}
function artSvg(p){const [a,b,c]=p.colors;const common=`<defs><linearGradient id="g-${p.id}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient><filter id="blur-${p.id}"><feGaussianBlur stdDeviation="17"/></filter></defs>`;let shape='';switch(p.art){case'night':shape=`<rect width="500" height="500" fill="url(#g-${p.id})"/><circle cx="360" cy="100" r="130" fill="${c}" opacity=".8" filter="url(#blur-${p.id})"/><path d="M0 370 Q120 230 250 360 T500 310 V500 H0Z" fill="${c}" opacity=".8"/><path d="M60 320 Q190 120 420 300" fill="none" stroke="#fff" stroke-width="2" opacity=".5"/>`;break;case'signal':shape=`<rect width="500" height="500" fill="url(#g-${p.id})"/><circle cx="250" cy="250" r="175" fill="none" stroke="${c}" stroke-width="38"/><circle cx="250" cy="250" r="105" fill="none" stroke="#f7e3cf" stroke-width="2"/><path d="M95 250h88l27-45 47 93 34-48h115" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>`;break;case'hours':shape=`<rect width="500" height="500" fill="url(#g-${p.id})"/><path d="M0 390 150 170 260 360 360 110 500 350V500H0Z" fill="${c}" opacity=".76"/><circle cx="250" cy="210" r="105" fill="none" stroke="#f4eef5" stroke-width="2"/><circle cx="250" cy="210" r="70" fill="none" stroke="#f4eef5" stroke-width="2" opacity=".65"/>`;break;case'cold':shape=`<rect width="500" height="500" fill="url(#g-${p.id})"/><path d="M70 50 250 250 100 450M430 50 250 250l150 200M250 40v420" fill="none" stroke="#edf4f2" stroke-width="12" opacity=".68"/><circle cx="250" cy="250" r="115" fill="${c}" opacity=".55"/>`;break;case'offline':shape=`<rect width="500" height="500" fill="url(#g-${p.id})"/><path d="M45 380 160 110 235 390 330 75 455 380" fill="none" stroke="${c}" stroke-width="30" stroke-linejoin="bevel"/><path d="M80 420h340" stroke="#fff6d8" stroke-width="3" opacity=".8"/>`;break;default:shape=`<rect width="500" height="500" fill="url(#g-${p.id})"/><circle cx="250" cy="250" r="175" fill="none" stroke="${c}" stroke-width="2"/><circle cx="250" cy="250" r="135" fill="none" stroke="#f0f4eb" stroke-width="22" opacity=".6"/><path d="M80 285 Q160 105 250 285T420 220" fill="none" stroke="#fff" stroke-width="4"/>`;}
return `<svg viewBox="0 0 500 500" role="img" aria-label="Abstract cover artwork for ${esc(p.title)}" xmlns="http://www.w3.org/2000/svg">${common}${shape}<text x="28" y="465" fill="#fff" font-size="20" font-family="Arial,sans-serif" font-weight="700" letter-spacing="3" opacity=".9">${esc(p.title)}</text></svg>`}
function iconPlay(){return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 10 6-10 6z" fill="currentColor" stroke="none"/></svg>'}

function player(p){return `<div class="player"><div class="player-row"><button class="player-btn" disabled aria-label="Audio preview unavailable">${iconPlay()}</button><div><div class="player-label">${esc(p.title)} · audio preview</div><div class="player-msg">PREVIEW UNAVAILABLE</div></div></div><p class="muted" style="font-size:12px;margin:10px 0 0">No audio file is currently available for this beat.</p></div>`}

class="info-num">01</div><h3>ORIGINAL SOUND</h3><p>Original instrumentals created for artists and independent musicians.</p></article><article class="info-card"><div class="info-num">02</div><h3>FLEXIBLE LICENSES</h3><p>Different licensing options depending on your project requirements.</p></article><article class="info-card"><div class="info-num">03</div><h3>SIMPLE EXPERIENCE</h3><p>Discover, preview, select, and review beats through one straightforward interface.</p></article></div></div></section><section class="section"><div class="container"><div class="section-head"><div><h2>HOW IT WORKS</h2><p>Four simple steps to move an idea forward.</p></div></div><div class="steps"><div class="step"><h3>Explore beats</h3></div><div class="step"><h3>Preview instrumentals</h3></div><div class="step"><h3>Choose a license</h3></div><div class="step"><h3>Continue to checkout</h3></div></div></div></section><section class="section"><div class="container"><div class="cta-band"><h2>YOUR NEXT RELEASE STARTS HERE.</h2><a class="btn btn-dark" href="#/explore">EXPLORE BEATS →</a></div></div></section>`}
function options(values,selected,label){return `<option value="">${label}</option>`+values.map(([v,t])=>`<option value="${esc(v)}" ${selected===v?'selected':''}>${esc(t)}</option>`).join('')}
function explore(){const q=new URLSearchParams(location.hash.split('?')[1]||'').get('q')||'';let list=PRODUCTS.filter(p=>`${p.title} ${p.genre} ${p.bpm} ${p.key}`.toLowerCase().includes(q.toLowerCase()));if(filters.genre)list=list.filter(p=>p.genre===filters.genre||filters.genre==='Trap'&&p.genre==='R&B / Trap');if(filters.bpm)list=list.filter(p=>{if(filters.bpm==='under120')return p.bpm<120;if(filters.bpm==='120-139')return p.bpm>=120&&p.bpm<=139;if(filters.bpm==='140-159')return p.bpm>=140&&p.bpm<=159;return p.bpm>=160});if(filters.key)list=list.filter(p=>p.key===filters.key);if(filters.price)list=list.filter(p=>filters.price==='under20'?p.price<20:filters.price==='20-25'?p.price>=20&&p.price<=25:p.price>25);const sort=document.getElementById('sortSelect')?.value||'newest';if(sort==='low')list.sort((a,b)=>a.price-b.price);if(sort==='high')list.sort((a,b)=>b.price-a.price);if(sort==='az')list.sort((a,b)=>a.title.localeCompare(b.title));if(sort==='za')list.sort((a,b)=>b.title.localeCompare(a.title));const active=[['genre','Genre',filters.genre],['bpm','BPM',({under120:'Under 120', '120-139':'120–139','140-159':'140–159',160:'160 and above'})[filters.bpm]],['key','Key',filters.key],['price','Price',({under20:'Under $20','20-25':'$20–$25',over25:'Above $25'})[filters.price]]].filter(x=>x[2]);return `<div class="container"><div class="page-intro"><span class="eyebrow">THE BEAT CATALOG</span><h1 class="page-h1">EXPLORE BEATS.</h1><p>Find an instrumental that fits your next idea. Filter, compare, and choose a license.</p></div><div class="catalog-toolbar"><div class="searchbox"><svg class="icon" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><input id="searchInput" type="search" placeholder="Search title, genre, BPM, or key" value="${esc(q)}" aria-label="Search beats"><button class="search-clear" data-action="clear-search" aria-label="Clear search">×</button></div><button id="openFilters" class="btn btn-outline mobile-filter" data-action="filter-open">☷ FILTERS${active.length?` (${active.length})`:''}</button><select class="select" id="sortSelect" aria-label="Sort beats"><option value="newest" ${sort==='newest'?'selected':''}>Newest</option><option value="low" ${sort==='low'?'selected':''}>Lowest price</option><option value="high" ${sort==='high'?'selected':''}>Highest price</option><option value="az" ${sort==='az'?'selected':''}>Alphabetical A–Z</option><option value="za" ${sort==='za'?'selected':''}>Alphabetical Z–A</option></select></div><div class="filters desktop-filters"><label>FILTER BY</label><select class="filter-select" data-filter="genre"><option value="">All genres</option>${[['R&B','R&B'],['Trap','Trap'],['R&B / Trap','R&B / Trap'],['Jerk','Jerk'],['Melodic Trap','Melodic Trap'],['Rage','Rage'],['Ambient Trap','Ambient Trap']].map(([v,t])=>`<option value="${v}" ${filters.genre===v?'selected':''}>${t}</option>`).join('')}</select><select class="filter-select" data-filter="bpm">${options([['under120','Under 120'],['120-139','120–139'],['140-159','140–159'],['160','160 and above']],filters.bpm,'Any BPM')}</select><select class="filter-select" data-filter="key">${options(['F#m','C#m','G#m','Am','Dm','Em'].map(x=>[x,x]),filters.key,'Any key')}</select><select class="filter-select" data-filter="price">${options([['under20','Under $20'],['20-25','$20–$25'],['over25','Above $25']],filters.price,'Any price')}</select></div><div class="active-filters">${active.map(([k,l,v])=>`<span class="filter-pill">${l}: ${esc(v)} <button data-action="remove-filter" data-key="${k}" aria-label="Remove ${l} filter">×</button></span>`).join('')}${active.length?'<button class="clear-filters" data-action="clear-filters">Clear all</button>':''}</div><div class="result-row"><span>${list.length} ${list.length===1?'beat':'beats'} found</span><span>Starting prices shown in USD</span></div>${list.length?`<div class="grid">${list.map(card).join('')}</div>`:`<div class="empty"><div class="empty-icon">⌕</div><h3>No beats found</h3><p>Try changing your search or clearing the filters.</p><button class="btn btn-outline" data-action="clear-filters">Clear all filters</button></div>`}</div>`}
function details(id){const p=getProduct(id);if(!p)return `<div class="container"><div class="empty"><h2>Beat not found</h2><p>This beat may no longer be available.</p><a class="btn btn-dark" href="#/explore">Browse beats</a></div></div>`;if(!getLicense(selectedLicense)||selectedLicense==='exclusive')selectedLicense='basic';const related=PRODUCTS.filter(x=>x.id!==p.id).slice(0,3);return `<div class="container"><div class="details"><div><div class="details-art">${artSvg(p)}</div></div><div><span class="eyebrow">ORIGINAL INSTRUMENTAL</span><h1 class="page-h1" style="margin-top:8px">${esc(p.title)}</h1><div class="specs"><span class="spec">Genre · <b>${esc(p.genre)}</b></span><span class="spec">BPM · <b>${p.bpm}</b></span><span class="spec">Key · <b>${esc(p.key)}</b></span></div>${player(p)}<h2 style="font-size:20px;margin-top:25px">Choose a license</h2><div class="license-grid">${LICENSES.map(l=>`<button class="license-card ${selectedLicense===l.id?'selected':''}" data-action="license-select" data-license="${l.id}" aria-pressed="${selectedLicense===l.id}"><strong>${l.name}</strong><span class="license-price">${l.price===null?'Contact for pricing':money(l.price)}</span><small>${l.files.length?l.files.join(' · ')+' · ':''}${esc(l.summary)}</small></button>`).join('')}</div><a href="#" class="terms-link" data-action="terms">View license terms placeholder</a>${selectedLicense==='exclusive'?`<div class="exclusive-note">Exclusive inquiries are not purchasable in this demo. Availability must be confirmed and producer approval is required.</div><a class="btn btn-outline btn-block" href="#/contact?type=licensing">ASK ABOUT EXCLUSIVE AVAILABILITY</a>`:`<div class="details-price">${money(getLicense(selectedLicense).price)}</div><p class="muted" style="font-size:13px">Demonstration license price · See placeholder terms before any real use.</p><button class="btn btn-dark btn-block" data-action="add" data-id="${p.id}" data-license="${selectedLicense}">ADD ${getLicense(selectedLicense).name} TO CART</button>`}<h2 style="font-size:20px;margin-top:28px">About this beat</h2><p class="muted">A production description will be added here. This placeholder does not describe any additional rights or legal terms.</p></div></div><div class="related"><div class="section-head"><div><h2>RELATED BEATS</h2></div><a class="arrow-link" href="#/explore">BROWSE ALL →</a></div><div class="grid">${related.map(card).join('')}</div></div></div>`}
function addItem(productId,licenseId){const p=getProduct(productId),l=getLicense(licenseId);if(!p||!l)return toast('This beat or license is unavailable.','error');if(l.id==='exclusive'){location.hash='#/contact?type=licensing';return toast('Exclusive licensing requires producer confirmation.')}const found=cart.find(x=>x.productId===productId&&x.licenseId===licenseId);if(found){toast('This beat and license are already in your cart.');location.hash='#/cart';return}cart.push({productId,licenseId,quantity:1});saveCart();toast(`${p.title} added to cart.`)}
function cartPage(){if(!cart.length)return `<div class="container"><div class="page-intro"><span class="eyebrow">YOUR SELECTION</span><h1 class="page-h1">SHOPPING CART.</h1></div><div class="empty"><div class="empty-icon">♧</div><h2>Your cart is empty</h2><p>Explore beats and choose the license that fits your project.</p><a class="btn btn-dark" href="#/explore">EXPLORE BEATS</a></div></div>`;return `<div class="container"><div class="page-intro"><span class="eyebrow">YOUR SELECTION</span><h1 class="page-h1">SHOPPING CART.</h1></div><div class="split"><div class="stack">${cart.map((x,i)=>{const p=getProduct(x.productId),l=getLicense(x.licenseId);return `<article class="cart-item"><div class="cart-thumb">${artSvg(p)}</div><div><h3>${esc(p.title)}</h3><p>${esc(p.genre)} · ${p.bpm} BPM · ${esc(p.key)}</p><label class="sr" for="lic-${i}">License for ${esc(p.title)}</label><select id="lic-${i}" class="filter-select" data-action="cart-license" data-index="${i}" aria-label="Change ${esc(p.title)} license"><option value="basic" ${x.licenseId==='basic'?'selected':''}>Basic Lease · ${money(19.99)}</option><option value="premium" ${x.licenseId==='premium'?'selected':''}>Premium Lease · ${money(39.99)}</option></select><p>${l.files.join(' · ')}</p></div><div class="cart-item-end"><strong>${money(l.price*x.quantity)}</strong><button class="remove-btn" data-action="remove" data-index="${i}">Remove</button></div></article>`}).join('')}</div><aside class="summary"><h3>ORDER SUMMARY</h3>${cart.map(x=>`<div class="summary-line"><span>${esc(getProduct(x.productId).title)} · ${getLicense(x.licenseId).name}</span><span>${money(getLicense(x.licenseId).price)}</span></div>`).join('')}<div class="summary-line"><span>Subtotal</span><span>${money(cartTotal())}</span></div><div class="summary-line summary-total"><span>Total</span><span>${money(cartTotal())}</span></div><p class="muted" style="font-size:11px">Demonstration prices. No payment will be collected.</p><a class="btn btn-dark btn-block" href="#/checkout">CONTINUE TO DEMO CHECKOUT</a><a class="btn btn-outline btn-block" href="#/explore">Continue browsing</a></aside></div></div>`}

function termsPage(){return `<div class="container"><div class="page-intro"><span class="eyebrow">INFORMATION</span><h1 class="page-h1">LICENSE TERMS.</h1></div><div class="about-copy"><div class="demo-alert">Placeholder only — actual license terms have not been supplied. This page is not a legal agreement. Do not rely on these demo descriptions as a grant of rights.</div><p>Basic and Premium lease labels, file delivery descriptions, and usage summaries are demonstrations. Before any real purchase or use, license terms must be provided and confirmed by the producer. No copyright ownership or specific usage rights are represented here.</p><a class="btn btn-outline" href="#/explore">Back to beats</a></div></div>`}
function confirmation(){let o;try{o=JSON.parse(sessionStorage.getItem('afb_demo_review')||'null')}catch(_){o=null}if(!o)return `<div class="container"><div class="page-intro"><h1 class="page-h1">DEMO ORDER REVIEW.</h1></div><div class="empty"><h2>No order review is available</h2><p>Submit the demo checkout form to review an order.</p><a class="btn btn-dark" href="#/cart">Go to cart</a></div></div>`;return `<div class="container"><div class="page-intro"><span class="eyebrow">NO PAYMENT TAKEN</span><h1 class="page-h1">DEMO ORDER REVIEW.</h1></div><div class="confirm-box"><h2>Review prepared — not an order confirmation</h2><p class="muted">This frontend demo has not processed payment or sent your information. No transaction or delivery was created.</p><div class="confirm-details"><div class="confirm-cell"><span>Name</span><b>${esc(o.name)}</b></div><div class="confirm-cell"><span>Email</span><b>${esc(o.email)}</b></div>${o.artist?`<div class="confirm-cell"><span>Artist name</span><b>${esc(o.artist)}</b></div>`:''}${o.notes?`<div class="confirm-cell"><span>Notes</span><b>${esc(o.notes)}</b></div>`:''}</div><h3>Selected items</h3>${o.items.map(x=>`<div class="summary-line"><span>${esc(x.title)} · ${esc(x.license)}</span><b>${money(x.price)}</b></div>`).join('')}<div class="summary-line summary-total"><span>Demo total</span><span>${money(o.total)}</span></div><p class="muted" style="font-size:12px;margin:16px 0 0">Customer details are held only for this browser tab's demo review and are not submitted to a server.</p></div></div>`}
function route(){const hash=location.hash||'#/';const [path]=hash.slice(1).split('?');let html;if(path==='/'||path==='/home')html=home();else if(path==='/explore')html=explore();else if(path.startsWith('/beat/'))html=details(decodeURIComponent(path.slice(6)));else if(path==='/cart')html=cartPage();else if(path==='/checkout')html=checkout();else if(path==='/about')html=about();else if(path==='/contact')html=contact();else if(path==='/confirmation')html=confirmation();else if(path==='/terms'||path==='/privacy')html=termsPage();else html=`<div class="container"><div class="empty"><h2>Page not found</h2><a class="btn btn-dark" href="#/">Return home</a></div></div>`;document.getElementById('app').innerHTML=html;document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===(path==='/'?'home':path.startsWith('/beat/')?'explore':path.slice(1))));updateCartCount();closeMenu();window.scrollTo(0,0);}
function closeMenu(){mobileMenu=false;document.getElementById('mobileNav').classList.remove('open');document.getElementById('menuToggle').setAttribute('aria-expanded','false');document.body.classList.remove('lock')}
function filterResults(){const search=document.getElementById('searchInput');const q=search?.value||'';const sort=document.getElementById('sortSelect')?.value||'newest';const hashq=q?`?q=${encodeURIComponent(q)}`:'';history.replaceState(null,'',`#/explore${hashq}`);const old=document.getElementById('sortSelect');route();const next=document.getElementById('sortSelect');if(next)next.value=sort}
function openFilterDrawer(){const root=document.getElementById('overlayRoot');root.innerHTML=`<div class="drawer-shade open" data-action="filter-close"></div><section class="drawer open" role="dialog" aria-modal="true" aria-label="Beat filters"><div class="drawer-head"><h3>Filter beats</h3><button class="icon-btn" data-action="filter-close" aria-label="Close filters">×</button></div>${[['genre','Genre',[['R&B','R&B'],['Trap','Trap'],['R&B / Trap','R&B / Trap'],['Jerk','Jerk'],['Melodic Trap','Melodic Trap'],['Rage','Rage'],['Ambient Trap','Ambient Trap']]],['bpm','BPM',[['under120','Under 120'],['120-139','120–139'],['140-159','140–159'],['160','160 and above']]],['key','Musical key',['F#m','C#m','G#m','Am','Dm','Em'].map(x=>[x,x])],['price','Price',[['under20','Under $20'],['20-25','$20–$25'],['over25','Above $25']]]].map(([k,label,opts])=>`<div class="filter-group"><strong>${label}</strong><select data-drawer-filter="${k}"><option value="">Any ${label.toLowerCase()}</option>${opts.map(([v,t])=>`<option value="${v}" ${filters[k]===v?'selected':''}>${t}</option>`).join('')}</select></div>`).join('')}<button class="btn btn-dark btn-block" data-action="filter-apply">SHOW BEATS</button></section>`;document.body.classList.add('lock')}
function closeFilterDrawer(){document.getElementById('overlayRoot').innerHTML='';document.body.classList.remove('lock')}
function validate(form){let good=true;const data=new FormData(form);const values=Object.fromEntries(data.entries());const rules={name:!values.name?.trim()?'Please enter your name.':'',email:!values.email?.trim()?'Please enter your email address.':!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(values.email)?'Enter a valid email address.':'',type:!values.type?'Choose an inquiry type.':'',message:!values.message?.trim()?'Please enter a message.':''};for(const [key,msg] of Object.entries(rules)){const field=form.querySelector(`[name="${key}"]`);const err=form.querySelector(`[data-error="${key}"]`);if(err)err.textContent=msg;if(field)field.setAttribute('aria-invalid',msg?'true':'false');if(msg)good=false}return {good,values}}
document.addEventListener('click',e=>{const action=e.target.closest('[data-action]')?.dataset.action;if(action==='add'){const b=e.target.closest('[data-action=add]');addItem(b.dataset.id,b.dataset.license);return}if(action==='preview'){toast('PREVIEW UNAVAILABLE — no audio file has been supplied.');return}if(action==='remove'){cart.splice(Number(e.target.closest('[data-action=remove]').dataset.index),1);saveCart();route();toast('Item removed from cart.');return}if(action==='license-select'){selectedLicense=e.target.closest('[data-action=license-select]').dataset.license;const id=location.hash.split('?')[0].slice(6);route();return}if(action==='clear-search'){const input=document.getElementById('searchInput');if(input){input.value='';filterResults()}return}if(action==='clear-filters'){filters={genre:'',bpm:'',key:'',price:''};const input=document.getElementById('searchInput');if(input)input.value='';history.replaceState(null,'','#/explore');route();return}if(action==='remove-filter'){filters[e.target.closest('[data-action=remove-filter]').dataset.key]='';route();return}if(action==='filter-open'){openFilterDrawer();return}if(action==='filter-close'){closeFilterDrawer();return}if(action==='filter-apply'){document.querySelectorAll('[data-drawer-filter]').forEach(s=>filters[s.dataset.drawerFilter]=s.value);closeFilterDrawer();route();return}if(action==='terms'){e.preventDefault();document.getElementById('overlayRoot').innerHTML=`<div class="modal-shade" data-action="modal-close"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h3 id="modalTitle">License terms placeholder</h3><button class="modal-close" data-action="modal-close" aria-label="Close dialog">×</button></div><div class="modal-text">Actual legal license terms have not been supplied. These demonstration descriptions are not a legal agreement and do not state specific usage permissions or transfer copyright ownership.</div><button class="btn btn-dark btn-block" data-action="modal-close">CLOSE</button></section></div>`;return}if(action==='modal-close'&&e.target.classList.contains('modal-shade')){document.getElementById('overlayRoot').innerHTML='';return}if(action==='modal-close'){document.getElementById('overlayRoot').innerHTML='';return}});
document.addEventListener('input',e=>{if(e.target.id==='searchInput'){const pos=e.target.selectionStart;filterResults();const n=document.getElementById('searchInput');if(n){n.focus();n.setSelectionRange(pos,pos)}}});document.addEventListener('change',e=>{const target=e.target;if(target.matches('[data-filter]')){filters[target.dataset.filter]=target.value;route()}if(target.id==='sortSelect'){const q=document.getElementById('searchInput')?.value||'';history.replaceState(null,'',`#/explore${q?'?q='+encodeURIComponent(q):''}`);route();document.getElementById('sortSelect').value=target.value}if(target.matches('[data-action="cart-license"]')){const i=Number(target.dataset.index);const next=target.value;if(cart.some((x,j)=>j!==i&&x.productId===cart[i].productId&&x.licenseId===next)){toast('That beat and license are already in the cart.','error');route();return}cart[i].licenseId=next;saveCart();route()}});
document.addEventListener('submit',e=>{if(e.target.id==='checkoutForm'){e.preventDefault();if(!cart.length){toast('Your cart is empty.','error');location.hash='#/cart';return}const {good,values}=validate(e.target);if(!good){e.target.querySelector('[aria-invalid=true]')?.focus();return}const order={name:values.name.trim(),email:values.email.trim(),artist:values.artist.trim(),notes:values.notes.trim(),items:cart.map(x=>({title:getProduct(x.productId).title,license:getLicense(x.licenseId).name,price:getLicense(x.licenseId).price})),total:cartTotal()};try{sessionStorage.setItem('afb_demo_review',JSON.stringify(order))}catch(_){toast('Could not prepare the demo review in this browser.','error');return}location.hash='#/confirmation';return}if(e.target.id==='contactForm'){e.preventDefault();const {good}=validate(e.target);if(!good){e.target.querySelector('[aria-invalid=true]')?.focus();return}document.getElementById('overlayRoot').innerHTML=`<div class="modal-shade" data-action="modal-close"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="contactReview"><div class="modal-head"><h3 id="contactReview">Message review — demo only</h3><button class="modal-close" data-action="modal-close" aria-label="Close dialog">×</button></div><p>Your form is valid, but this demonstration does not send messages. Please use the displayed contact email once configured.</p><button class="btn btn-dark btn-block" data-action="modal-close">CLOSE</button></section></div>`;return}});
document.getElementById('menuToggle').addEventListener('click',()=>{mobileMenu=!mobileMenu;document.getElementById('mobileNav').classList.toggle('open',mobileMenu);document.getElementById('menuToggle').setAttribute('aria-expanded',String(mobileMenu));document.body.classList.toggle('lock',mobileMenu)});document.getElementById('mobileNav').addEventListener('click',e=>{if(e.target.closest('a'))closeMenu()});window.addEventListener('hashchange',route);window.addEventListener('popstate',route);route();
</script>
</body>
