<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AFFANJALANBAIK — FIND YOUR SOUND.</title>
<meta name="theme-color" content="#FFFFFF">
<style>
/* ============ DESIGN SYSTEM ============ */
:root{
  --bg:#FFFFFF;--bg2:#F7F7F8;--bg3:#F0F1F2;--text:#171717;--text2:#737373;
  --muted:#A3A3A3;--border:#E5E5E5;--accent:#B7E65A;--dark:#171717;
  --white:#FFF;--success:#258A55;--error:#D64545;--warn:#D99A32;
  --radius:12px;--maxw:1200px;
  --pad:clamp(16px,4vw,32px);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--font);color:var(--text);background:var(--bg);line-height:1.55;
  padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:16px} /* 16px = no iOS zoom */
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--text);outline-offset:2px;border-radius:4px}
.container{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Typography */
h1{font-size:clamp(36px,6vw,58px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
h2{font-size:clamp(24px,4vw,30px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
h3{font-size:17px;font-weight:600}
.page-h1{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.02em}
.meta{font-size:12px;color:var(--text2)}
.body{font-size:15px;color:var(--text2);max-width:60ch}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:0 24px;border-radius:10px;font-weight:600;font-size:14px;
  letter-spacing:.02em;transition:all .18s ease;user-select:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--dark);color:var(--white)}
.btn-primary:hover{background:#000}
.btn-secondary{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--text)}
.btn-accent{background:var(--accent);color:var(--text)}
.btn-accent:hover{filter:brightness(.95)}
.btn-ghost{color:var(--text2);padding:0 12px;min-height:40px}
.btn-ghost:hover{color:var(--text)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn-sm{min-height:36px;padding:0 16px;font-size:13px}
.btn-block{width:100%}

/* Header */
header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
.header-in{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad);height:72px;
  display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{font-weight:800;font-size:15px;letter-spacing:.06em;white-space:nowrap}
nav.main{display:flex;gap:4px}
nav.main a{padding:8px 14px;border-radius:8px;font-size:14px;font-weight:500;
  color:var(--text2);transition:all .18s}
nav.main a:hover{color:var(--text)}
nav.main a.active{color:var(--text);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.header-right{display:flex;align-items:center;gap:8px}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:10px;color:var(--text);transition:background .18s;position:relative}
.icon-btn:hover{background:var(--bg2)}
.cart-badge{position:absolute;top:4px;right:4px;min-width:17px;height:17px;padding:0 4px;
  background:var(--accent);color:var(--text);border-radius:9px;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
#menuBtn{display:none}
.mobile-nav{display:none;position:fixed;inset:0;z-index:99;background:var(--bg);padding:88px var(--pad) 24px}
.mobile-nav.open{display:block}
.mobile-nav a{display:block;padding:16px 0;font-size:18px;font-weight:600;
  border-bottom:1px solid var(--border)}
.mobile-nav a.active{color:var(--text)}
.mobile-nav a.active::after{content:"";display:inline-block;width:8px;height:8px;margin-left:10px;
  border-radius:50%;background:var(--accent)}

/* Hero */
.hero{padding:64px 0 48px}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.hero-art{aspect-ratio:1;max-width:440px;width:100%;justify-self:end}
.hero p{margin:20px 0 32px;font-size:17px;color:var(--text2);max-width:44ch}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap}
@media(max-width:860px){.hero-grid{grid-template-columns:1fr}.hero{padding:40px 0 32px}
  .hero-art{justify-self:center;max-width:300px;order:-1}}

/* Sections */
section.block{padding:56px 0}
@media(max-width:760px){section.block{padding:40px 0}}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:32px;flex-wrap:wrap}
.sec-head p{color:var(--text2);font-size:14px;margin-top:6px}
.link-arrow{font-size:14px;font-weight:600;color:var(--text);display:inline-flex;align-items:center;gap:6px}
.link-arrow:hover{gap:10px}.link-arrow{transition:gap .18s}

/* Cards grid */
.grid{display:grid;gap:20px;grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:400px){.grid{grid-template-columns:1fr}}

/* Beat card */
.beat-card{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
  background:var(--bg);display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}
.beat-card:hover{box-shadow:0 8px 24px rgba(0,0,0,.07);transform:translateY(-2px)}
.cover{position:relative;aspect-ratio:1;background:var(--bg2)}
.cover svg{width:100%;height:100%;display:block}
.play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(23,23,23,0);transition:background .2s;opacity:0}
.beat-card:hover .play-overlay{opacity:1;background:rgba(23,23,23,.35)}
.play-overlay button{width:56px;height:56px;border-radius:50%;background:var(--white);
  display:flex;align-items:center;justify-content:center}
.playing-dot{position:absolute;top:10px;right:10px;width:10px;height:10px;border-radius:50%;
  background:var(--accent);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.4}}
.card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card-title-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card-title{font-size:16px;font-weight:700;letter-spacing:-.01em}
.card-price{font-size:15px;font-weight:700;white-space:nowrap}
.card-meta{display:flex;gap:6px;flex-wrap:wrap}
.chip-tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;
  background:var(--bg2);color:var(--text2)}
.card-actions{display:flex;gap:8px;margin-top:auto;padding-top:8px}
.card-actions .btn{flex:1;min-height:40px;font-size:13px}
.cover-link{position:absolute;inset:0;z-index:1}
.play-overlay,.card-actions{position:relative;z-index:2}

/* Filter chips */
.chip{padding:7px 14px;border-radius:20px;border:1px solid var(--border);font-size:13px;
  font-weight:500;color:var(--text2);transition:all .18s;background:var(--bg)}
.chip:hover{border-color:var(--text2)}
.chip.on{background:var(--text);color:var(--white);border-color:var(--text)}
.chip.on::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--accent);margin-right:7px;vertical-align:1px}

/* Toolbar / search */
.toolbar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.search-wrap{flex:1;min-width:220px;position:relative}
.search-wrap input{width:100%;height:46px;border:1px solid var(--border);border-radius:10px;
  padding:0 44px 0 42px;font-size:15px;background:var(--bg);transition:border-color .18s}
.search-wrap input:focus{outline:none;border-color:var(--text)}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;
  border-radius:8px;color:var(--text2);display:none;align-items:center;justify-content:center}
.search-wrap input:not(:placeholder-shown)~.search-clear{display:inline-flex}
.select{height:46px;border:1px solid var(--border);border-radius:10px;padding:0 12px;
  background:var(--bg);font-size:14px;color:var(--text)}
.active-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filter-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;
  border-radius:20px;background:var(--bg2);font-size:12px;font-weight:600}
.filter-pill button{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:var(--text2);font-size:13px}
.filter-pill button:hover{background:var(--bg3);color:var(--text)}

/* Filter drawer (mobile) */
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:120;
  opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:121;background:var(--bg);
  border-radius:20px 20px 0 0;max-height:80vh;overflow:auto;
  transform:translateY(100%);transition:transform .25s ease;
  padding:20px var(--pad) calc(24px + env(safe-area-inset-bottom))}
.drawer.open{transform:translateY(0)}
.drawer-backdrop.open{opacity:1;pointer-events:auto}
.drawer h3{margin-bottom:16px}
.filter-group{margin-bottom:20px}
.filter-group h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--text2);margin-bottom:10px}
.filter-group .chips{display:flex;flex-wrap:wrap;gap:8px}
#filterDrawerBtn{display:none}
@media(max-width:760px){#filterDrawerBtn{display:inline-flex}
  .desktop-filters{display:none}}

/* Results / states */
.results-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.state-box{text-align:center;padding:64px 20px;color:var(--text2)}
.state-box h3{color:var(--text);margin-bottom:8px}
.skeleton{border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;
  background:var(--bg);animation:sk 1.4s infinite}
@keyframes sk{50%{opacity:.6}}
.skeleton .sk-cover{aspect-ratio:1;background:var(--bg2)}
.skeleton .sk-line{height:14px;margin:14px 16px;border-radius:6px;background:var(--bg2)}

/* Audio player */
.player{border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;
  background:var(--bg2)}
.player-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.player-play{width:44px;height:44px;border-radius:50%;background:var(--dark);color:var(--white);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s}
.player-play:active{transform:scale(.92)}
.player-play[disabled]{background:var(--bg3);color:var(--muted);cursor:not-allowed}
.player-info{flex:1;min-width:0}
.player-title{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-time{font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums}
.progress{width:100%;height:6px;border-radius:3px;background:var(--bg3);cursor:pointer;
  -webkit-appearance:none;appearance:none;margin:8px 0}
.progress::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--dark);cursor:pointer}
.progress::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--dark);border:none}
.progress[disabled]{cursor:not-allowed}
.progress[disabled]::-webkit-slider-thumb{background:var(--muted)}
.player-msg{font-size:12px;font-weight:600;color:var(--warn);text-transform:uppercase;
  letter-spacing:.05em}
.player-msg.err{color:var(--error)}

/* Details page */
.details-grid{display:grid;grid-template-columns:minmax(0,440px) 1fr;gap:40px;
  padding:40px 0;align-items:start}
@media(max-width:860px){.details-grid{grid-template-columns:1fr;gap:24px}}
.details-cover{border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
.spec-row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.spec{padding:8px 14px;border:1px solid var(--border);border-radius:10px;font-size:13px}
.spec b{font-weight:600}
.price-big{font-size:28px;font-weight:800;margin:16px 0 8px}

/* Licenses */
.lic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}
@media(max-width:760px){.lic-grid{grid-template-columns:1fr}}
.lic-card{border
