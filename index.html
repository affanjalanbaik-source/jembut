<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="AFFANJALANBAIK marketplace for original instrumentals and music beats." />
  <meta name="theme-color" content="#FFFFFF" />
  <title>AFFANJALANBAIK — FIND YOUR SOUND.</title>
  <style>
    :root {
      --bg: #FFFFFF;
      --bg2: #F7F7F8;
      --bg3: #F0F1F2;
      --text: #171717;
      --text2: #737373;
      --muted: #A3A3A3;
      --border: #E5E5E5;
      --accent: #B7E65A;
      --dark: #171717;
      --white: #FFFFFF;
      --success: #258A55;
      --error: #D64545;
      --warn: #D99A32;
      --radius: 12px;
      --maxw: 1200px;
      --pad: clamp(16px, 4vw, 32px);
      --font: Inter, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }
    body {
      margin: 0;
      font-family: var(--font);
      background:
        radial-gradient(circle at top left, rgba(183, 230, 90, 0.14), transparent 28%),
        linear-gradient(180deg, #ffffff 0%, #fbfbfc 100%);
      color: var(--text);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      padding-bottom: env(safe-area-inset-bottom);
    }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea {
      font: inherit;
    }
    button {
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }
    img, svg {
      display: block;
      max-width: 100%;
    }
    input, select, textarea {
      font-size: 16px;
    }
    :focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .container {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 var(--pad);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    h1, h2, h3, h4, p {
      margin: 0;
    }
    h1 {
      font-size: clamp(36px, 5vw, 60px);
      line-height: 1.06;
      letter-spacing: -0.04em;
      font-weight: 800;
    }
    h2 {
      font-size: clamp(24px, 3vw, 32px);
      line-height: 1.15;
      letter-spacing: -0.03em;
      font-weight: 700;
    }
    h3 {
      font-size: clamp(18px, 2vw, 22px);
      line-height: 1.2;
      letter-spacing: -0.02em;
      font-weight: 600;
    }
    p {
      color: var(--text2);
      font-size: 15px;
    }
    .eyebrow {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text2);
      font-weight: 700;
      margin-bottom: 12px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(183, 230, 90, 0.12);
      border: 1px solid rgba(183, 230, 90, 0.22);
    }
    .meta {
      font-size: 12px;
      color: var(--text2);
      font-weight: 500;
    }
    .muted {
      color: var(--text2);
    }
    .small {
      font-size: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 22px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
      transition: all 0.18s ease;
      user-select: none;
      border: 1px solid transparent;
    }
    .btn:active { transform: scale(0.98); }
    .btn[disabled] {
      opacity: 0.46;
      cursor: not-allowed;
      pointer-events: none;
    }
    .btn-primary {
      background: var(--dark);
      color: var(--white);
      box-shadow: 0 6px 18px rgba(23,23,23,0.12);
    }
    .btn-primary:hover { background: #000; }
    .btn-secondary {
      background: rgba(255,255,255,0.78);
      color: var(--text);
      border-color: var(--border);
      backdrop-filter: blur(6px);
    }
    .btn-secondary:hover { border-color: var(--text); }
    .btn-accent {
      background: var(--accent);
      color: var(--text);
    }
    .btn-accent:hover { filter: brightness(0.96); }
    .btn-ghost {
      padding: 0 12px;
      min-height: 40px;
      color: var(--text2);
    }
    .btn-ghost:hover { color: var(--text); }
    .btn-sm {
      min-height: 36px;
      padding: 0 16px;
      font-size: 13px;
    }
    .btn-block { width: 100%; }

    .page-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 120;
      background: rgba(255, 255, 255, 0.9);
      border-bottom: 1px solid rgba(23,23,23,0.06);
      backdrop-filter: saturate(180%) blur(16px);
      -webkit-backdrop-filter: saturate(180%) blur(16px);
      padding-top: env(safe-area-inset-top);
      box-shadow: 0 1px 0 rgba(23,23,23,0.02);
    }
    .header-inner {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 var(--pad);
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .brand-mark {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(183, 230, 90, 0.18);
    }
    .nav {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .nav a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 8px 14px;
      border-radius: 8px;
      color: var(--text2);
      font-size: 14px;
      font-weight: 600;
      transition: all 0.18s ease;
    }
    .nav a:hover { color: var(--text); }
    .nav a.active {
      color: var(--text);
      box-shadow: inset 0 -2px 0 var(--accent);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon-btn {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      transition: background 0.18s ease;
    }
    .icon-btn:hover { background: var(--bg2); }
    .cart-badge {
      position: absolute;
      top: 5px;
      right: 5px;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      border: 1px solid rgba(0,0,0,0.04);
    }
    .mobile-toggle {
      display: none;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      align-items: center;
      justify-content: center;
    }
    .mobile-nav {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 110;
      background: rgba(255,255,255,0.98);
      padding: 88px var(--pad) 24px;
      overflow: auto;
    }
    .mobile-nav.open { display: block; }
    .mobile-nav-links {
      display: grid;
      gap: 10px;
    }
    .mobile-nav-links a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      font-size: 18px;
      font-weight: 600;
    }
    .mobile-nav-links a.active::after {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
      margin-left: 12px;
    }

    main {
      flex: 1;
    }
    .page-section {
      padding: 56px 0;
    }
    @media (max-width: 760px) {
      .page-section { padding: 42px 0; }
    }

    .hero {
      padding: 52px 0 36px;
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 40px;
      align-items: center;
    }
    .hero-copy {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .hero-copy h1 {
      text-shadow: 0 0 0 rgba(0,0,0,0);
    }
    .hero-copy p {
      font-size: 17px;
      max-width: 44ch;
      color: var(--text2);
    }
    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 6px;
    }
    .hero-art {
      width: min(100%, 440px);
      justify-self: end;
      background: linear-gradient(135deg, rgba(183,230,90,0.08), rgba(255,255,255,0));
      border-radius: 28px;
      padding: 18px;
    }
    @media (max-width: 860px) {
      .hero-grid { grid-template-columns: 1fr; }
      .hero-art { order: -1; width: min(100%, 300px); justify-self: center; }
      .hero { padding-top: 42px; }
    }

    .abstract-art {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 26px;
      overflow: hidden;
      border: 1px solid rgba(23,23,23,0.08);
      background: linear-gradient(135deg, #f1f3f0 0%, #ffffff 100%);
      box-shadow: 0 18px 40px rgba(0,0,0,0.08);
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .section-head p {
      margin-top: 6px;
      color: var(--text2);
      font-size: 14px;
      max-width: 56ch;
    }
    .link-arrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      transition: gap 0.18s ease;
    }
    .link-arrow:hover { gap: 12px; }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }
    @media (max-width: 900px) {
      .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px) {
      .card-grid { grid-template-columns: 1fr; }
    }

    .beat-card {
      background: linear-gradient(180deg, rgba(255,255,255,1) 0%, rgba(247,247,248,0.56) 100%);
      border: 1px solid rgba(23,23,23,0.07);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
      min-height: 100%;
      position: relative;
    }
    .beat-card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(183,230,90,0.04) 100%);
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .beat-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.07);
      border-color: rgba(23,23,23,0.12);
    }
    .beat-card:hover::after { opacity: 1; }
    .beat-cover {
      position: relative;
      aspect-ratio: 1;
      background: var(--bg2);
    }
    .cover-center {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(23,23,23,0);
      transition: background 0.2s ease, opacity 0.2s ease;
      opacity: 0;
    }
    .beat-card:hover .play-overlay {
      background: rgba(23,23,23,0.28);
      opacity: 1;
    }
    .circle-button {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(255,255,255,0.96);
      display: grid;
      place-items: center;
      box-shadow: 0 10px 24px rgba(0,0,0,0.14);
      position: relative;
      z-index: 2;
      transition: transform 0.18s ease;
    }
    .beat-card:hover .circle-button { transform: scale(1.05); }
    .playing-dot {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.4s infinite ease-in-out;
      z-index: 3;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.15); opacity: 0.6; }
    }
    .card-body {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    .card-topline {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      padding-bottom: 2px;
    }
    .mini-badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      background: rgba(183, 230, 90, 0.18);
      border: 1px solid rgba(183, 230, 90, 0.28);
      color: var(--text);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 8px;
    }
    .mini-badge.soft {
      background: var(--bg2);
      border-color: var(--border);
      letter-spacing: 0.04em;
      text-transform: none;
      font-weight: 700;
    }
    .card-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }
    .card-title {
      font-size: 16px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .card-price {
      font-weight: 700;
      font-size: 15px;
      white-space: nowrap;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 7px;
      background: var(--bg2);
      color: var(--text2);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .card-actions {
      margin-top: auto;
      display: flex;
      gap: 8px;
      padding-top: 8px;
    }
    .card-actions .btn {
      flex: 1;
      min-height: 40px;
      font-size: 13px;
      padding: 0 12px;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }
    @media (max-width: 760px) {
      .feature-grid { grid-template-columns: 1fr; }
    }
    .feature-card {
      padding: 22px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg2);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
    }
    .feature-card strong {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text2);
      margin-bottom: 10px;
    }
    .feature-card h3 {
      margin-bottom: 8px;
      font-size: 18px;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }
    @media (max-width: 820px) {
      .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px) {
      .steps { grid-template-columns: 1fr; }
    }
    .step {
      padding: 20px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      box-shadow: 0 8px 18px rgba(0,0,0,0.02);
    }
    .step-number {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .cta-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      background: linear-gradient(135deg, rgba(183,230,90,0.12), rgba(247,247,248,0.9));
      border: 1px solid rgba(183,230,90,0.24);
      border-radius: 20px;
      padding: 24px 22px;
      flex-wrap: wrap;
      box-shadow: 0 14px 24px rgba(0,0,0,0.02);
    }
    .cta-banner h2 {
      font-size: clamp(24px, 3vw, 34px);
    }

    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 220px;
    }
    .search-wrap input {
      width: 100%;
      min-height: 46px;
      padding: 0 44px 0 42px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255,255,255,0.86);
      color: var(--text);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
    }
    .search-wrap input:focus {
      outline: none;
      border-color: var(--text);
      box-shadow: 0 0 0 3px rgba(23,23,23,0.04);
    }
    .search-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }
    .search-clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: none;
      align-items: center;
      justify-content: center;
      color: var(--text2);
    }
    .search-wrap input:not(:placeholder-shown) + .search-clear,
    .search-wrap input:not(:placeholder-shown) ~ .search-clear {
      display: inline-flex;
    }
    .select {
      min-height: 46px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255,255,255,0.86);
      color: var(--text);
      padding: 0 12px;
      min-width: 160px;
    }
    .filter-btn {
      display: none;
    }

    .desktop-filters {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin: 16px 0 18px;
    }
    .filter-panel {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }
    .filter-panel h4 {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text2);
      margin-bottom: 10px;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text2);
      font-size: 12px;
      font-weight: 600;
      transition: all 0.18s ease;
    }
    .chip:hover { border-color: var(--text2); }
    .chip.active {
      background: var(--text);
      color: var(--white);
      border-color: var(--text);
      box-shadow: 0 6px 16px rgba(23,23,23,0.12);
    }
    .chip.active::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      margin-right: 8px;
    }
    .active-filters {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-height: 32px;
      margin-bottom: 8px;
    }
    .filter-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 8px 5px 12px;
      font-size: 12px;
      font-weight: 700;
    }
    .filter-pill button {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text2);
    }
    .filter-pill button:hover { background: var(--bg3); }
    .results-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin: 10px 0 18px;
    }
    .results-row .meta {
      font-weight: 600;
    }
    .state-box {
      padding: 58px 22px;
      text-align: center;
    }
    .state-box h3 {
      margin-bottom: 8px;
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.42);
      z-index: 130;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .drawer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 131;
      background: var(--bg);
      border-radius: 20px 20px 0 0;
      padding: 18px var(--pad) calc(24px + env(safe-area-inset-bottom));
      transform: translateY(100%);
      transition: transform 0.24s ease;
      max-height: 82vh;
      overflow: auto;
    }
    .drawer.open { transform: translateY(0); }
    .drawer-head {

    const LICENSES = {
      basic: {
        id: 'basic',

    };

    const state = {
      route: 'home',
      selectedBeatId: null,

        genre: [],

    init();

    function init() {
      if (!state.audio.element) {
        state.audio.element = new Audio();
        state.audio.element.preload = 'none';
      }
      bindGlobalEvents();
      render();
      handleHashChange();
    }

    function bindGlobalEvents() {
      window.addEventListener('hashchange', handleHashChange);
      document.addEventListener('click', handleDocumentClick);
      document.addEventListener('input', handleDocumentInput);
      document.addEventListener('change', handleDocumentChange);
      document.addEventListener('submit', handleDocumentSubmit);
    }

    function handleHashChange() {
      const hash = location.hash || '#/home';
      const route = hash.replace(/^#\/?/, '') || 'home';
      if (route.startsWith('beat/')) {
        state.route = 'detail';
        const beatId = route.replace('beat/', '');
        state.selectedBeatId = beatId;
      } else if (route === 'explore') {
        state.route = 'explore';
      } else if (route === 'about') {
        state.route = 'about';
      } else if (route === 'contact') {
        state.route = 'contact';
      } else if (route === 'cart') {
        state.route = 'cart';
      } else if (route === 'checkout') {
        state.route = 'checkout';
      } else if (route === 'confirmation') {
        state.route = 'confirmation';
      } else {
        state.route = 'home';
      }
      updateActiveNav();
      render();
    }

    function render() {
      const app = document.getElementById('app');
      const route = state.route;
      let html = '';

      if (route === 'home') html = renderHome();
      else if (route === 'explore') html = renderExplore();
      else if (route === 'detail') html = renderDetails();
      else if (route === 'about') html = renderAbout();
      else if (route === 'contact') html = renderContact();
      else if (route === 'cart') html = renderCart();
      else if (route === 'checkout') html = renderCheckout();
      else if (route === 'confirmation') html = renderConfirmation();
      else html = renderHome();

      app.innerHTML = html;
      renderCartBadge();
      updateMobileNav();
      renderFilterDrawer();
      renderMobileMenu();
      if (state.route === 'explore') {
        const sortSelect = document.getElementById('sortSelect');
        if (sortSelect) sortSelect.value = state.sort;
      }
    }

    function renderHome() {
      const featured = BEATS.slice(0, 3);
      return `

    function renderAudioPlayer(beat, expanded = false) {
      const hasSource = Boolean(beat.audioSource && beat.audioSource.trim());
      const isCurrent = state.audio.currentBeatId === beat.id;
      const progress = Math.min(100, (state.audio.currentTime / Math.max(state.audio.duration, 1)) * 100 || 0);
      const statusText = !hasSource ? 'Preview unavailable' : isCurrent && state.audio.playing ? 'Playing' : 'Ready';
      const canPlay = hasSource;
      return `
        <div class="player" aria-live="polite">
          <div class="player-top">
            <button type="button" class="player-play" data-action="play-beat" data-beat-id="${beat.id}" ${canPlay ? '' : 'disabled'} aria-label="Preview ${beat.title}">
              ${isCurrent && state.audio.playing ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 5h3v14H8zm5 0h3v14h-3z" fill="currentColor"/></svg>' : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 5v14l11-7-11-7z" fill="currentColor"/></svg>'}

            <div class="player-info">
              <div class="player-title">${beat.title}</div>
              <div class="player-time">${hasSource ? `${formatTime(state.audio.currentTime)} / ${formatTime(state.audio.duration)}` : 'No audio asset loaded'}</div>
            </div>
          </div>
          <input type="range" class="player-slider" min="0" max="100" step="0.1" value="${Math.round(progress)}" ${canPlay ? '' : 'disabled'} aria-label="Playback progress for ${beat.title}" />
          <div class="player-msg ${!hasSource ? 'error' : ''}">${statusText}</div>
        </div>
      `;
    }

      const normalized = name.toLowerCase();
      const selected = state.filters[normalized] || [];
      const title = name === 'bpm' ? 'BPM' : name === 'price' ? 'Price' : name === 'key' ? 'Musical key' : 'Genre';
      const values = options;
      return `
        <div class="filter-panel">
          <h4>${title}</h4>
          <div class="chips">
            ${values.map(option => `
              <button type="button" class="chip ${selected.includes(option) ? 'active' : ''}" data-filter-group="${normalized}" data-filter-value="${option}">${option}</button>
            `).join('')}
          </div>
        </div>
      `;
    }

          <div class="meta">${license.summary}</div>
          <div class="detail-actions" style="margin-top: 14px;">
            <button type="button" class="btn btn-primary btn-block" data-action="select-license" data-license-id="${licenseId}" data-beat-id="${beat.id}">${licenseId === 'exclusive' ? 'Request exclusive' : 'Select license'}</button>
          </div>
          <div class="license-link" style="margin-top: 12px; display: block;">${license.terms}</div>
          ${licenseId === 'exclusive' ? '<div class="exclusive-callout">Availability must be confirmed and producer approval is required before any exclusive arrangement is accepted.</div>' : ''}
        </article>
      `;
    }

    function renderCartItem(item) {
      const beat = BEATS.find(b => b.id === item.beatId);
      const license = LICENSES[item.licenseId] || LICENSES.basic;
      return `
        <div class="cart-item">
          <div class="cart-cover">${renderArtSVG(beat)}</div>
          <div class="details">
            <h3>${beat.title}</h3>
            <div class="cart-meta">
              <span class="tag">${beat.genre}</span>
              <span class="tag">${beat.key}</span>
            </div>
            <select class="cart-license-select" data-action="update-license" data-item-id="${item.id}" aria-label="Choose license for ${beat.title}">
              <option value="basic" ${item.licenseId === 'basic' ? 'selected' : ''}>Basic Lease — ${formatUsd(LICENSES.basic.price)}</option>
              <option value="premium" ${item.licenseId === 'premium' ? 'selected' : ''}>Premium Lease — ${formatUsd(LICENSES.premium.price)}</option>
              <option value="exclusive" ${item.licenseId === 'exclusive' ? 'selected' : ''}>Exclusive — Inquiry</option>
            </select>
            <div class="meta">${license.summary}</div>
          </div>
          <div style="display: grid; justify-items: end; gap: 12px;">
            <strong>${formatUsd((license.price || 0) * item.quantity)}</strong>
            <button type="button" class="remove-btn" data-action="remove-cart-item" data-item-id="${item.id}">Remove</button>
          </div>
        </div>
      `;
    }

    function renderCheckoutLine(item) {
      const beat = BEATS.find(b => b.id === item.beatId);
      const license = LICENSES[item.licenseId] || LICENSES.basic;
      const total = (license.price || 0) * item.quantity;
      return `
        <div class="summary-line">
          <span>${beat.title} · ${license.name}</span>
          <strong>${formatUsd(total)}</strong>
        </div>
      `;
    }

    function renderEmptyState(message) {
      return `
        <div class="state-box">
          <h3>No beats found</h3>
          <p>${message}</p>
          <div class="detail-actions" style="justify-content: center; margin-top: 18px;">
            <button type="button" class="btn btn-secondary" data-action="clear-all-filters">Clear filters</button>
          </div>
        </div>
      `;
    }

    function renderArtSVG(beat, large = false) {
      const [c1, c2, c3, c4] = beat.palette;
      return `
        <svg class="cover-center" viewBox="0 0 340 340" role="img" aria-label="Artwork for ${beat.title}" preserveAspectRatio="xMidYMid slice">
          <defs>
            <linearGradient id="grad-${beat.id}" x1="0%" x2="100%" y1="0%" y2="100%">
              <stop offset="0%" stop-color="${c1}" />
              <stop offset="55%" stop-color="${c2}" />
              <stop offset="100%" stop-color="${c4}" />
            </linearGradient>
          </defs>
          <rect width="340" height="340" fill="url(#grad-${beat.id})"/>
          <circle cx="95" cy="110" r="120" fill="${c3}" opacity="0.28"/>
          <circle cx="255" cy="232" r="138" fill="${c2}" opacity="0.34"/>
          <path d="M-10 260C74 205 122 130 196 120C246 111 290 142 340 110V340H-10V260Z" fill="${c4}" opacity="0.22"/>
          <path d="M40 220C92 150 150 120 216 126C246 129 278 143 312 152" stroke="${c1}" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.9"/>
          <path d="M52 118C112 88 138 82 174 92" stroke="${c1}" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
          <path d="M70 276C130 208 216 188 278 210" stroke="${c3}" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.7"/>
          <rect x="42" y="42" width="100" height="100" rx="18" fill="rgba(255,255,255,0.2)"/>
          <circle cx="220" cy="128" r="10" fill="rgba(255,255,255,0.66)"/>
          <circle cx="148" cy="210" r="8" fill="rgba(255,255,255,0.76)"/>
        </svg>
      `;
    }

    function renderFilterPill(filter) {
      const [group, value] = filter;
      return `
        <span class="filter-pill">
          ${value}
          <button type="button" data-action="remove-filter" data-filter-group="${group}" data-filter-value="${value}" aria-label="Remove filter ${value}">×</button>
        </span>
      `;
    }

    function getFilteredBeats() {
      let filtered = [...BEATS];

      if (state.search.trim()) {
        const q = state.search.trim().toLowerCase();
        filtered = filtered.filter(beat => (
          beat.title.toLowerCase().includes(q) ||
          beat.genre.toLowerCase().includes(q) ||
          String(beat.bpm).includes(q) ||
          beat.key.toLowerCase().includes(q)
        ));
      }

      Object.keys(state.filters).forEach(group => {
        const values = state.filters[group];
        if (!values.length) return;

        filtered = filtered.filter(beat => {
          if (group === 'genre') return values.includes(beat.genre);
          if (group === 'bpm') {
            return values.some(value => {
              if (value === 'Under 120') return beat.bpm < 120;
              if (value === '120–139') return beat.bpm >= 120 && beat.bpm <= 139;
              if (value === '140–159') return beat.bpm >= 140 && beat.bpm <= 159;
              if (value === '160 and above') return beat.bpm >= 160;
              return false;
            });
          }
          if (group === 'key') return values.includes(beat.key);
          if (group === 'price') {
            return values.some(value => {
              if (value === 'Under $20') return beat.startingPrice < 20;
              if (value === '$20–$25') return beat.startingPrice >= 20 && beat.startingPrice <= 25;
              if (value === 'Above $25') return beat.startingPrice > 25;
              return false;
            });
          }
          return true;
        });
      });

      if (state.sort === 'lowest') filtered.sort((a, b) => a.startingPrice - b.startingPrice);
      else if (state.sort === 'highest') filtered.sort((a, b) => b.startingPrice - a.startingPrice);
      else if (state.sort === 'alphabetical-asc') filtered.sort((a, b) => a.title.localeCompare(b.title));
      else if (state.sort === 'alphabetical-desc') filtered.sort((a, b) => b.title.localeCompare(a.title));
      else filtered = filtered.slice().sort((a, b) => b.bpm - a.bpm);

      return filtered;
    }

    function getActiveFilterList() {
      const list = [];
      Object.entries(state.filters).forEach(([group, values]) => {
        values.forEach(value => list.push([group, value]));
      });
      return list;
    }

    function handleDocumentClick(event) {
      const routeLink = event.target.closest('[data-route]');
      if (routeLink) {
        const route = routeLink.getAttribute('data-route');
        if (route) {
          event.preventDefault();
          const newHash = route === 'home' ? '#/home' : `#/${route}`;
          location.hash = newHash;
          state.mobileMenuOpen = false;
          updateMobileNav();
          return;
        }
      }

      const actionEl = event.target.closest('[data-action]');
      if (!actionEl) return;
      const action = actionEl.getAttribute('data-action');

      if (action === 'toggle-menu') {
        state.mobileMenuOpen = !state.mobileMenuOpen;
        updateMobileNav();
        return;
      }

      if (action === 'open-cart') {
        location.hash = '#/cart';
        return;
      }

      if (action === 'close-filter-drawer') {
        state.mobileMenuOpen = false;
        updateMobileNav();
        return;
      }

      if (action === 'clear-search') {
        state.search = '';
        render();
        return;
      }

      if (action === 'clear-all-filters') {
        state.filters = { genre: [], bpm: [], key: [], price: [] };
        render();
        return;
      }

      if (action === 'toggle-filter-drawer') {
        state.mobileMenuOpen = !state.mobileMenuOpen;
        updateMobileNav();
        return;
      }

      if (action === 'remove-filter') {
        const group = actionEl.getAttribute('data-filter-group');
        const value = actionEl.getAttribute('data-filter-value');
        if (!group) return;
        state.filters[group] = (state.filters[group] || []).filter(item => item !== value);
        render();
        return;
      }

      if (action === 'view-beat') {
        const beatId = actionEl.getAttribute('data-beat-id');
        state.selectedBeatId = beatId;
        location.hash = '#/beat/' + beatId;
        return;
      }

      if (action === 'add-to-cart') {
        const beatId = actionEl.getAttribute('data-beat-id');
        const licenseId = actionEl.getAttribute('data-license-id') || 'basic';
        addToCart(beatId, licenseId);
        return;
      }

      if (action === 'remove-cart-item') {
        const itemId = actionEl.getAttribute('data-item-id');
        state.cart = state.cart.filter(item => item.id !== itemId);
        persistCart();
        render();
        return;
      }

      if (action === 'select-license') {
        const beatId = actionEl.getAttribute('data-beat-id');
        const licenseId = actionEl.getAttribute('data-license-id');
        state.selectedBeatId = beatId;
        state.selectedLicense = licenseId;
        location.hash = '#/beat/' + beatId;
        setTimeout(() => {
          const card = document.querySelector(`[data-license-id="${licenseId}"]`);
          if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 50);
        return;
      }

      if (action === 'play-beat') {
        const beatId = actionEl.getAttribute('data-beat-id');
        toggleAudio(beatId);
      }
    }

    function handleDocumentInput(event) {
      const input = event.target;
      if (input.id === 'searchInput') {
        state.search = input.value;
        render();
        return;
      }
    }

    function handleDocumentChange(event) {
      const target = event.target;
      if (target.id === 'sortSelect') {
        state.sort = target.value;
        render();
        return;
      }

      if (target.classList && target.classList.contains('chip')) {
        const group = target.getAttribute('data-filter-group');
        const value = target.getAttribute('data-filter-value');
        if (!group || !value) return;
        const current = state.filters[group] || [];
        if (current.includes(value)) {
          state.filters[group] = current.filter(item => item !== value);
        } else {
          state.filters[group] = [...current, value];
        }
        render();
      }

      if (target.classList && target.classList.contains('cart-license-select')) {
        const itemId = target.getAttribute('data-item-id');
        const newLicense = target.value;
        state.cart = state.cart.map(item => {
          if (item.id === itemId) {
            return { ...item, licenseId: newLicense };
          }
          return item;
        });
        persistCart();
        render();
      }
    }

    function handleDocumentSubmit(event) {
      const form = event.target;
      if (form.id === 'contactForm') {
        event.preventDefault();
        const values = {
          name: form.querySelector('[name="name"]').value.trim(),
          email: form.querySelector('[name="email"]').value.trim(),
          inquiryType: form.querySelector('[name="inquiryType"]').value,
          message: form.querySelector('[name="message"]').value.trim()
        };

        const errors = validateContactForm(values);
        showFieldErrors(form, errors);
        if (Object.keys(errors).length) {
          return;
        }

        showToast('Demo inquiry submitted. No live email was sent.');
        form.reset();
        return;
      }

      if (form.id === 'checkoutForm') {
        event.preventDefault();
        const values = {
          fullName: form.querySelector('[name="fullName"]').value.trim(),
          email: form.querySelector('[name="email"]').value.trim(),
          artistName: form.querySelector('[name="artistName"]').value.trim(),
          notes: form.querySelector('[name="notes"]').value.trim()
        };

        const errors = validateCheckoutForm(values);
        showFieldErrors(form, errors);
        if (Object.keys(errors).length) {
          return;
        }

        const orderItems = state.cart.map(item => {
          const beat = BEATS.find(b => b.id === item.beatId);
          const license = LICENSES[item.licenseId] || LICENSES.basic;
          return {
            beatId: item.beatId,
            title: beat.title,
            licenseId: item.licenseId,
            licenseName: license.name,
            total: (license.price || 0) * item.quantity
          };
        });

        const total = orderItems.reduce((sum, item) => sum + item.total, 0);
        const order = {
          fullName: values.fullName,
          email: values.email,
          artistName: values.artistName,
          notes: values.notes,
          items: orderItems,
          total
        };

        localStorage.setItem('abDemoOrder', JSON.stringify(order));
        state.cart = [];
        persistCart();
        location.hash = '#/confirmation';
        showToast('Demo order reviewed.');
      }
    }

    function validateContactForm(values) {
      const errors = {};
      if (!values.name) errors.name = 'Name is required.';
      if (!values.email) errors.email = 'Email is required.';
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(values.email)) errors.email = 'Please enter a valid email.';
      if (!values.inquiryType) errors.inquiryType = 'Please choose an inquiry type.';
      if (!values.message) errors.message = 'Message is required.';
      return errors;
    }

    function validateCheckoutForm(values) {
      const errors = {};
      if (!values.fullName) errors.fullName = 'Full name is required.';
      if (!values.email) errors.email = 'Email is required.';
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(values.email)) errors.email = 'Please enter a valid email address.';
      return errors;
    }

    function showFieldErrors(form, errors) {
      form.querySelectorAll('.input-error').forEach(node => node.textContent = '');
      Object.entries(errors).forEach(([key, value]) => {
        const node = form.querySelector(`[data-error-for="${key}"]`);
        if (node) node.textContent = value;
      });
    }

    function addToCart(beatId, licenseId) {
      const beat = BEATS.find(item => item.id === beatId);
      if (!beat) return;
      if (licenseId === 'exclusive') {
        showToast('Exclusive licensing requires producer confirmation.');
        state.selectedBeatId = beatId;
        location.hash = '#/beat/' + beatId;
        return;
      }

      const existing = state.cart.find(item => item.beatId === beatId && item.licenseId === licenseId);
      if (existing) {
        existing.quantity += 1;
      } else {
        state.cart.push({ id: `${beatId}-${licenseId}-${Date.now()}`, beatId, licenseId, quantity: 1 });
      }

      persistCart();
      renderCartBadge();
      showToast(`${beat.title} added to cart.`);
      if (state.route === 'cart') render();
    }

    function calculateCartSubtotal() {
      return state.cart.reduce((sum, item) => {
        const license = LICENSES[item.licenseId] || LICENSES.basic;
        return sum + (license.price || 0) * item.quantity;
      }, 0);
    }

    function persistCart() {
      localStorage.setItem('abCart', JSON.stringify(state.cart));
    }

    function loadCart() {
      try {
        const raw = localStorage.getItem('abCart');
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed.filter(item => item && item.beatId && item.licenseId) : [];
      } catch (error) {
        return [];
      }
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function renderCartBadge() {
      const badge = document.querySelector('.cart-badge');
      if (!badge) return;
      const total = state.cart.reduce((sum, item) => sum + item.quantity, 0);
      badge.textContent = total;
    }

    function updateActiveNav() {
      const links = document.querySelectorAll('[data-route]');
      const current = state.route === 'detail' ? 'explore' : state.route;
      links.forEach(link => {
        const route = link.getAttribute('data-route');
        link.classList.toggle('active', route === current);
      });
    }

    function updateMobileNav() {
      const nav = document.getElementById('mobileNav');
      if (!nav) return;
      nav.classList.toggle('open', state.mobileMenuOpen);
      const links = nav.querySelectorAll('a');
      const current = state.route === 'detail' ? 'explore' : state.route;
      links.forEach(link => {
        link.classList.toggle('active', link.getAttribute('data-route') === current);
      });
    }

    function renderMobileMenu() {
      const mobile = document.getElementById('mobileNav');
      if (!mobile) return;
      mobile.classList.toggle('open', state.mobileMenuOpen);
    }

    function renderFilterDrawer() {
      const drawer = document.getElementById('filterDrawer');
      if (!drawer) return;
      drawer.classList.toggle('open', state.mobileMenuOpen);
      const backdrop = document.querySelector('.drawer-backdrop');
      if (backdrop) backdrop.classList.toggle('open', state.mobileMenuOpen);
    }

    function toggleAudio(beatId) {
      const beat = BEATS.find(item => item.id === beatId);
      if (!beat || !beat.audioSource) {
        showToast('Preview unavailable. Add an MP3 source to enable playback.');
        return;
      }

      const audio = state.audio.element;
      if (state.audio.currentBeatId === beatId && !audio.paused) {
        audio.pause();
        state.audio.playing = false;
        state.audio.currentBeatId = null;
        render();
        return;
      }

      const current = state.audio.currentBeatId;
      if (current && current !== beatId && !audio.paused) {
        audio.pause();
      }

      if (audio.src !== beat.audioSource) {
        audio.src = beat.audioSource;
      }

      state.audio.currentBeatId = beatId;
      audio.play().then(() => {
        state.audio.playing = true;
        render();
      }).catch(() => {
        state.audio.playing = false;
        showToast('Audio preview could not start.');
      });
    }

    function formatUsd(value) {
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(Number(value || 0));
    }

    function formatTime(value) {
      if (!Number.isFinite(value) || value <= 0) return '0:00';
      const minutes = Math.floor(value / 60);
      const seconds = Math.floor(value % 60).toString().padStart(2, '0');
      return `${minutes}:${seconds}`;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
